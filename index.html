<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="app/assets/css/main.css">
    <link rel="stylesheet" href="app/assets/css/tema.css">
    <link rel="stylesheet" href="app/assets/css/login.css">

    <script type="module" src="app/assets/js/firebase/auth.js"></script>
    <script src="app/assets/js/services/themes.js"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="app/assets/js/services/initThemeIndex.js"></script>
</head>

<body>

    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form method="post">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>

            <button type="button" id="btnEntrar">Entrar</button>
        </form>

        <div class="links">
            <a href="#">¿Olvidaste tu contraseña?</a> | <a href="app/register.html">Registrarse</a>
        </div>

        <div class="links">
            <a href="./app/crearSolicitud.html">Crear solicitud</a>
        </div>
    </div>

</body>

</html>
