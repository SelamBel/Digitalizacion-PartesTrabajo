<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rellenar parte</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" id="tema-css" href="assets/css/tema.css">
    <link rel="stylesheet" href="assets/css/rellenarParte.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="assets/js/services/header-footer.js"></script>
    <script src="assets/js/services/themes.js"></script>
</head>

<body>

    <div class="header-container"></div>
    <main>
        <div class="reportes">
            <form>
                <fieldset>
                    <label for="cliente">Cliente</label>
                    <textarea id="descripcion" rows="2" placeholder="Datos del cliente" disabled></textarea>

                    <label for="titulo">Título de la solicitud</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ej: Reparación impresora" disabled>

                    <label for="descripcion">Descripción de la solicitud</label>
                    <textarea id="descripcion" rows="4" placeholder="Describe el problema o tarea" disabled></textarea>

                    <label for="localizacion">Localización de el problema</label>
                    <input type="text" id="localizacion" name="localizacion"
                        placeholder="Ej: Calle Reyes Católicos 5 Puerta 2" disabled>

                    <label for="empleado">Asignar a empleado</label>
                    <select id="empleado" name="empleado" multiple disabled>
                        <option value="1">Juan Pérez</option>
                        <option value="2">María López</option>
                        <option value="3">Carlos García</option>
                        <option value="4">Ana Torres</option>
                    </select>

                    <label for="fecha">Fecha:</label>
                    <input type="date" name="fecha" id="fecha"><br>

                    <label for="horas">Horas trabajadas:</label>
                    <input type="number" name="horas" id="horas"><br>
                    
                    <label for="material">Material utilizado:</label>
                    <textarea rows="5"></textarea><br>
                </fieldset>

                <div class="botones">
                    <button type="button" class="cancelar">Cancelar</button>
                    <input type="submit" value="Guardar">
                </div>

            </form>
        </div>
    </main>

    <div class="footer-container"></div>
</body>

</html>
