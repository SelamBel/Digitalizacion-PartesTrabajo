<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rellenar parte</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" id="tema-css" href="assets/css/tema.css">
    <link rel="stylesheet" href="assets/css/rellenarParte.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="assets/js/services/header-footer.js" type="module"></script>
    <script src="assets/js/services/themes.js"></script>
    <script src="assets/js/services/rellenarParte.js" type="module"></script>
</head>

<body>

    <div class="header-container"></div>
    <main>
            <form id="form_partes">
                <fieldset>
                    <label for="cliente">Cliente</label>
                    <textarea id="descripcionCliente" rows="3" value="Datos del cliente" disabled></textarea>

                    <label for="titulo">Título de la solicitud</label>
                    <input type="text" id="titulo" name="titulo" value="Ej: Reparación impresora" disabled>

                    <label for="descripcion">Descripción de la solicitud</label>
                    <textarea id="descripcionSolicitud" rows="4" value="Describe el problema o tarea"
                        disabled></textarea>

                    <label for="localizacion">Localización de el problema</label>
                    <input type="text" id="localizacion" name="localizacion" disabled>

                    <label for="empleado">Asignar a empleado</label>
                    <select id="empleado" name="empleado" multiple disabled>
                    </select>

                    <label for="fecha">Fecha:</label>
                    <input type="date" name="fecha" id="fecha"><br>

                    <label for="horas">Horas trabajadas:</label>
                    <input type="number" name="horas" id="horas"><br>

                    <label for="material">Material utilizado:</label>
                    <textarea id="materialUtilizado" rows="5"></textarea><br>
                </fieldset>
                
                <div class="response"> <i class="fa-regular fa-circle-check"></i> Datos recogidos con exito</div>

                <div class="botones">
                    <button type="button" id="cancelarParte" class="cancelar">
                      Cancelar
                    </button>
                    <input type="submit" id="submitParte" class="button" value="Guardar">
                </div>

            </form>
    </main>

    <div class="footer-container"></div>
</body>

</html>
