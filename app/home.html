<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Usuario</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" id="tema-css" href="assets/css/tema.css">
    <link rel="stylesheet" href="assets/css/home.css">
    <script type="module" src="assets/js/services/home.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="assets/js/services/themes.js"></script>
    <script src="assets/js/services/header-footer.js" type="module"></script>

<body>
    <div class="header-container"></div>
    <main>
        <h2 id="tit-tickets">Tickets Asignados</h2>
        <table id="tabla-tickets">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Título</th>
                    <th class="desaparecer">Descripción</th>
                    <th>Localización</th>
                    <th class="desaparecer">Estado</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>


        <h2 id="tit-partes">Partes</h2>
        <table id="tabla-partes">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Título</th>
                    <th>Localización</th>
                    <th class="desaparecer">Horas</th>
                    <th class="desaparecer">Material Utilizado</th>
                    <th class="desaparecer">Estado</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>
