<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear ticket</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" id="tema-css" href="assets/css/tema.css">
    <link rel="stylesheet" href="assets/css/crearTicket.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="assets/js/services/header-footer.js" type="module"></script>
    <script src="assets/js/services/themes.js"></script>
    <script type="module" src="assets/js/services/crearTicket.js"></script>
</head>

<body>

    <div class="header-container"></div>

    <main>
        <form id="form_ticket">
            <fieldset>
                <label for="cliente">Cliente</label>
                <textarea id="datosCliente" rows="3" placeholder="Datos del cliente" disabled></textarea>

                <label for="titulo">Título de la solicitud</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ej: Reparación impresora" disabled>

                <label for="descripcion">Descripción de la solicitud</label>
                <textarea id="descripcion" rows="4" placeholder="Describe el problema o tarea" disabled></textarea>

                <label for="localizacion">Localización de el problema</label>
                <input type="text" id="localizacion" name="localizacion"
                    placeholder="Ej: Calle Reyes Católicos 5 Puerta 2" disabled>
                <label for="empleado">Asignar a empleado</label>
                <select id="empleado" name="empleado" multiple>
                    <option value="1">Juan Pérez</option>
                    <option value="2">María López</option>
                    <option value="3">Carlos García</option>
                    <option value="4">Ana Torres</option>
                </select>

                <label for="prioridad">Prioridad</label>
                <select id="prioridad" name="prioridad">
                    <option value="baja">Baja</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                </select>

                <label for="estado">Estado inicial</label>
                <select id="estado" name="estado">
                    <option value="pendiente">Pendiente</option>
                    <option value="en_proceso">En proceso</option>
                </select>

            </fieldset>

            <div class="botones">
                <button type="button" class="cancelar">Cancelar</button>
                <input type="submit" value="Crear ticket">
            </div>

        </form>
    </main>

    <div class="footer-container"></div>
</body>

</html>
