<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/tema.css">
    <link rel="stylesheet" href="assets/css/home.css"> 
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>
<body>
    <div class="header-container"></div>

    <main>
        <div class="detalle-container">
            <h2>Restablecer Contraseña</h2>
            
            <p>Introduce tu correo y te ayudaremos a recuperar el acceso a tu cuenta.</p>

            <form id="form-recuperar">
                <div>
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <button type="submit" class="btn-ver">Recuperar</button>
            </form>

            <div>
                <a href="../index.html">
                    <i class="fa-solid fa-arrow-left"></i> Volver al Login
                </a>
            </div>
        </div>
    </main>

    <div class="footer-container"></div>

    <script type="module" src="./assets/js/firebase/recuperarPass.js"></script>
</body>
</html>
