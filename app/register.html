<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/tema.css">
    <link rel="stylesheet" href="assets/css/login.css">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    
    <script src="assets/js/services/themes.js"></script>
    <script src="assets/js/services/header-footer.js" type="module"></script>
    <script type="module" src="assets/js/firebase/register.js"></script>
</head>

<body>

    <div class="login-container">
        <h2>Registro</h2>
        <form method="post">

            <label for="cliente">Nombre</label>
            <input type="text" id="cliente" name="cliente" placeholder="Ej: Mauricio Colmenero">

            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" placeholder="Ej: 12345678A">


            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Ej: MauriColme@gmail.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ej: SyN3r4eVr" required>
            <label for="password">Confirmar contraseña</label>
            <input type="password" id="confirmPass" name="confirmPass" placeholder="Ej: SyN3r4eVr" required>

            <button type="button" id="btnRegistrar">Registrar</button>
        </form>

        <div class="links">
            <a href="olvido-password.html">¿Olvidaste tu contraseña?</a> | <a href="../index.html">Iniciar Sesión</a>
        </div>

        <div class="links">
            <a href="./crearSolicitud.html">Crear solicitud</a>
        </div>
    </div>

</body>

</html>
